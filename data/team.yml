    bio: |-
      Scott Quigley has significant experience investing in multinational corporations and middle-market companies and advising on mergers and acquisitions, debt and equity recapitalizations and financial restructurings. He has extensive knowledge and expertise in capital markets, structured products, non-investment grade debt, workouts and industrial credits.

      Previously, he was a managing director in Wells Fargo’s principal investments group and a senior member of the investment team for leveraged loans and high yield bonds that managed CLOs and up to $3.5 billion in assets under management. Mr. Quigley took the leadership role in many intercreditor discussions for amendments and workouts and valued, managed and gave investment recommendations for companies going under financial restructuring including legal precedent setting bankruptcies such as Delphi Corporation, General Motors and Hayes-Lemmerz.

      Prior to joining Wells Fargo in 2006, Mr. Quigley had over 15 years of experience as an investment banker to non-investment grade companies and as a CPA. He had worked at Bear Stearns, Houlihan Lokey, Miller Tabak Roberts, Stone & Youngberg and Deloitte & Touche.

      Mr. Quigley earned a BA from UCLA and an MBA in finance from the Ross School of Business at the University of Michigan. Mr. Quigley is licensed as a Certified Public Accountant (Inactive) in the State of California.
